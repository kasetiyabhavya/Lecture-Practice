<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guzal Kid - Complete Exact Match</title>
    <!-- Tailwind CSS v4 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>
<body class="bg-[#FFFDF6] text-gray-800">

    <!-- Header Section (Exact Match with Cart Button) -->
    <header class="bg-[#FFF9EC] px-6 md:px-12 py-5 flex items-center justify-between border-b border-[#F7EED9] sticky top-0 z-50">
        <!-- Left: Hamburger Menu -->
        <div class="flex items-center">
            <button class="text-gray-900 text-2xl focus:outline-none cursor-pointer">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>

        <!-- Center: Guzal Logo (Multi-colored) -->
        <div class="flex items-center">
            <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight flex items-center">
                <span class="text-[#FF5C77]">g</span>
                <span class="text-[#FFA41B]">ü</span>
                <span class="text-[#4DA3FF]">z</span>
                <span class="text-[#2EC4B6]">al</span>
            </h1>
        </div>

        <!-- Right: Search, Profile & Exact Cart Button -->
        <div class="flex items-center gap-4 md:gap-6">
            <button class="text-gray-800 text-xl hover:text-[#FF5C77] transition cursor-pointer">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
            <button class="text-gray-800 text-xl hover:text-[#FF5C77] transition cursor-pointer hidden sm:block">
                <i class="fa-regular fa-user"></i>
            </button>
            <!-- Exact Cart Design from Screenshot -->
            <div class="bg-[#FF5C77] text-white pl-5 pr-2.5 py-2 rounded-full flex items-center gap-3 cursor-pointer shadow-sm hover:bg-[#e04c66] transition">
                <span class="text-sm font-medium tracking-wide">Cart: 0 Item</span>
                <div class="bg-black text-white w-8 h-8 rounded-full flex items-center justify-center text-sm shadow-inner">
                    <i class="fa-solid fa-cart-shopping"></i>
                </div>
            </div>
        </div>
    </header>

    <!-- Hero Section (Pink Background & Your Uploaded Kids Image) -->
    <section class="bg-[#FFD1DC] relative overflow-hidden px-8 md:px-20 pt-16 pb-20 flex flex-col md:flex-row items-center justify-between">
        
        <!-- Left Content Area -->
        <div class="z-10 max-w-xl mb-12 md:mb-0">
            <h2 class="text-4xl sm:text-5xl md:text-6xl font-extrabold text-gray-900 leading-[1.15] mb-6 tracking-tight">
                Welcome to <br>
                <span>Guzal Kid</span> 
                <span class="inline-block transform -rotate-12 translate-y-1 ml-1 text-4xl">🦒</span>
            </h2>
            <p class="text-gray-700 text-sm sm:text-base max-w-md mb-8 leading-relaxed font-normal">
                Lorem ipsum dolor sit amet consectetur. Egestas ornare viverra sapien augue vel habitant cursus.
            </p>
            <button class="bg-[#FF5C77] text-white px-6 py-3 rounded-full font-medium shadow-md hover:bg-[#e04c66] transition flex items-center gap-3 text-sm cursor-pointer">
                Show Now 
                <span class="bg-white text-[#FF5C77] w-6 h-6 rounded-full flex items-center justify-center text-xs shadow-sm">
                    <i class="fa-solid fa-arrow-right"></i>
                </span>
            </button>
        </div>

        <!-- Right Illustration Area with Your Uploaded Image -->
        <div class="relative z-10 w-full md:w-1/2 flex justify-center items-center">
            <!-- Background Cream Blob Shape -->
            <div class="absolute w-[320px] h-[320px] md:w-[440px] md:h-[440px] bg-[#FFF5E1] rounded-full filter blur-md opacity-90 -z-10"></div>
            
            <!-- Your Exact Uploaded Image File -->
            <img src="images/images_1.png" 
                 alt="Three Happy Kids with Caps" 
                 class="relative z-10 object-cover w-full max-w-[460px] h-auto drop-shadow-2xl rounded-3xl border-4 border-white/40">
        </div>

    </section>

  </body>
</html>
